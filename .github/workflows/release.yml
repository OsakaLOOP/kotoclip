name: Build and release desktop packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      mode:
        description: "运行模式"
        required: true
        type: choice
        default: macos-python-resource
        options:
          - macos-python-resource
          - full-build

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    if: github.event_name == 'push' || inputs.mode == 'full-build'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: tauri-app.exe
            builder: unidic-vibrato-build.exe
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            binary: tauri-app
            builder: unidic-vibrato-build
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify tracked release resources
        run: npm run verify:release-resources

      - name: Build UniDic resource generator
        run: cargo build --release --target ${{ matrix.target }} -p kotoclip-core --bin unidic-vibrato-build

      - name: Download and prepare NLP runtime resources
        run: >-
          python scripts/prepare_release_resources.py
          --builder target/${{ matrix.target }}/release/${{ matrix.builder }}

      - name: Verify generated release dependencies
        run: npm run verify:release-resources -- --require-generated

      - name: Build desktop executable
        run: npm run tauri -- build --target ${{ matrix.target }} --config src-tauri/tauri.github-release.conf.json --no-bundle

      - name: Create portable ZIP
        run: >-
          python scripts/package_portable.py
          --target ${{ matrix.name }}
          --binary target/${{ matrix.target }}/release/${{ matrix.binary }}
          --output release-packages
          --name Kotoclip-${{ matrix.name }}

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotoclip-${{ matrix.name }}
          path: release-packages/Kotoclip-${{ matrix.name }}.zip
          if-no-files-found: error
          retention-days: 14

  macos-python-resource:
    name: Prepare macOS Python resource
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'macos-python-resource'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare GiNZA runtime
        run: python scripts/prepare_release_resources.py --python-only --output release-resources

      - name: Package Python resource
        run: >-
          python scripts/package_python_resource.py
          --input release-resources
          --output Kotoclip-insider-portable-macos-arm64-python.zip

      - name: Upload resource
        uses: actions/upload-artifact@v4
        with:
          name: Kotoclip-insider-portable-macos-arm64-python
          path: Kotoclip-insider-portable-macos-arm64-python.zip
          if-no-files-found: error
          compression-level: 0

  release:
    name: Create GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download portable ZIPs
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: kotoclip-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/**/*
