name: Build and release desktop packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: tauri-app.exe
            nlp_asset: Kotoclip-insider-portable-nlp.zip
            python_asset: Kotoclip-insider-portable-windows-x64-python.zip
          - name: macos-arm64
            os: macos-14
            target: aarch64-apple-darwin
            binary: tauri-app
            nlp_asset: Kotoclip-insider-portable-nlp.zip
            python_asset: Kotoclip-insider-portable-macos-arm64-python.zip
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify tracked release resources
        run: npm run verify:release-resources

      - name: Download prebuilt NLP resources
        run: >-
          python scripts/fetch_release_resources.py
          --nlp-url https://github.com/${{ github.repository }}/releases/download/resources-v1/${{ matrix.nlp_asset }}
          --python-url https://github.com/${{ github.repository }}/releases/download/resources-v1/${{ matrix.python_asset }}
          --output release-resources

      - name: Verify generated release dependencies
        run: npm run verify:release-resources -- --require-generated

      - name: Build desktop executable
        run: npm run tauri -- build --target ${{ matrix.target }} --config src-tauri/tauri.github-release.conf.json --no-bundle

      - name: Create portable ZIP
        run: >-
          python scripts/package_portable.py
          --target ${{ matrix.name }}
          --binary target/${{ matrix.target }}/release/${{ matrix.binary }}
          --output release-packages
          --name Kotoclip-${{ matrix.name }}

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: kotoclip-${{ matrix.name }}
          path: release-packages/Kotoclip-${{ matrix.name }}.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download portable ZIPs
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: kotoclip-*
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/**/*
