[package]
name = "kotoclip-quality-diff"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
